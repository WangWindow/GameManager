[workspace]
members = ["crates/gamemanager-core", "crates/gamemanager-desktop"]
default-members = ["crates/gamemanager-desktop"]
resolver = "3"

[workspace.package]
version = "0.10.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
dark-light = "3.0"
directories = "6"
flate2 = "1.1"
futures-util = "0.3"
gamemanager-core = { path = "crates/gamemanager-core" }
glob = "0.3"
infer = "0.22"
icoextract_rs = "0.1.2"
iced = { version = "0.14", features = ["tokio", "image-without-codecs", "svg"] }
iced-shadcn-v2 = { git = "https://github.com/FerrisMind/shadcn-rs.git", rev = "96982c1c2a3c567d4ee847b72521711556fd98c1", default-features = false, features = [
    "core",
    "fonts",
    "forms",
    "overlays",
    "wgpu",
] }
image = { version = "0.25", default-features = false, features = [
    "ico",
    "png",
] }
lucide-icons = { version = "1.31", features = ["iced"] }
open = "5.4"
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
] }
rfd = { version = "0.17", default-features = false, features = [
    "wayland",
    "xdg-portal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tar = "0.4"
thiserror = "2"
toasty = { version = "0.10", features = ["sqlite"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
