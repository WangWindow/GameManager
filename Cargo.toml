[workspace]
members = ["crates/gamemanager-core", "crates/gamemanager-desktop"]
default-members = ["crates/gamemanager-desktop"]
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
directories = "6"
flate2 = "1.1"
futures-util = "0.3"
glob = "0.3"
icoextract_rs = "0.1.2"
iced = { version = "0.14", features = ["tokio", "image-without-codecs", "svg"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
gamemanager-core = { path = "crates/gamemanager-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toasty = { version = "0.9", features = ["sqlite"] }
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
