[workspace]
members = ["crates/gamemanager-core", "crates/gamemanager-desktop"]
default-members = ["crates/gamemanager-desktop"]
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
dark-light = "3.0"
directories = "6"
flate2 = "1.1"
futures-util = "0.3"
gamemanager-core = { path = "crates/gamemanager-core" }
glob = "0.3"
icoextract_rs = "0.1.2"
iced = { version = "0.14", features = ["tokio", "image-without-codecs", "svg"] }
image = { version = "0.25", default-features = false, features = [
    "ico",
    "png",
] }
open = "5.4"
rfd = { version = "0.17", default-features = false, features = [
    "wayland",
    "xdg-portal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = "2"
toasty = { version = "0.10", features = ["sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
