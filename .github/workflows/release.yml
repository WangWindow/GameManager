name: Release Build

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install native build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            zip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build native app
        run: |
          set -e
          cargo build --release -p gamemanager-desktop

      - name: List release executable
        run: ls -lh target/release/gamemanager

      - name: Package executable zip
        run: |
          set -e
          cd target/release
          test -f gamemanager
          zip -j gamemanager-linux-x86_64.zip gamemanager
          echo "Packaged gamemanager-linux-x86_64.zip"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            target/release/gamemanager-linux-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
